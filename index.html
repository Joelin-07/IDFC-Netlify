<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Whilter.AI — Analytics Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=Instrument+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #080a0e;
      --surface:  #0f1118;
      --border:   #1c1f2e;
      --accent:   #3b82f6;
      --accent-g: #6366f1;
      --text:     #dde1f0;
      --muted:    #585e7a;
      --danger:   #f87171;
      --success:  #34d399;
    }

    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: 'Instrument Sans', sans-serif; font-weight: 300;
      overflow: hidden;
    }

    /* ── Mesh background ── */
    .mesh {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 70% 60% at 15% 20%, rgba(59,130,246,0.10) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 85% 80%, rgba(99,102,241,0.09) 0%, transparent 60%);
    }
    .grid-lines {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 52px 52px;
      opacity: 0.35;
      mask-image: radial-gradient(ellipse 90% 90% at 50% 50%, black 20%, transparent 100%);
    }

    /* ── Layout ── */
    .page {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }

    /* ── Card ── */
    .card {
      width: 100%; max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 48px 44px;
      animation: rise 0.55s cubic-bezier(0.16,1,0.3,1) both;
      position: relative;
      /* subtle inner glow */
      box-shadow: 0 0 0 1px rgba(59,130,246,0.04), 0 32px 80px rgba(0,0,0,0.5);
    }
    /* accent top bar */
    .card::before {
      content: '';
      position: absolute; top: 0; left: 20%; right: 20%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), var(--accent-g), transparent);
      border-radius: 99px;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(28px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Logo mark ── */
    .logo {
      display: flex; align-items: center; gap: 11px; margin-bottom: 36px;
    }
    .logo-mark {
      width: 38px; height: 38px; border-radius: 9px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-g) 100%);
      display: flex; align-items: center; justify-content: center;
    }
    .logo-mark svg { width: 20px; height: 20px; fill: #fff; }
    .logo-name {
      font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1rem;
      letter-spacing: 0.01em; color: var(--text);
    }

    .card-title {
      font-family: 'Syne', sans-serif; font-weight: 700;
      font-size: 1.65rem; line-height: 1.2; margin-bottom: 6px;
    }
    .card-sub {
      font-size: 0.84rem; color: var(--muted); margin-bottom: 34px;
    }

    /* ── Fields ── */
    .field { margin-bottom: 18px; position: relative; }

    label {
      display: block; font-size: 0.72rem; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--muted); margin-bottom: 8px;
    }

    .input-wrap { position: relative; }
    .input-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      width: 15px; height: 15px; fill: var(--muted); pointer-events: none;
      transition: fill 0.2s;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%; padding: 12px 16px 12px 40px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text);
      font-family: 'Instrument Sans', sans-serif; font-size: 0.9rem;
      outline: none; transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.14);
    }
    input:focus + .input-icon,
    .input-wrap:focus-within .input-icon { fill: var(--accent); }
    input::placeholder { color: var(--muted); }

    /* password toggle */
    .toggle-pw {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; padding: 2px;
      color: var(--muted); line-height: 0; transition: color 0.2s;
    }
    .toggle-pw:hover { color: var(--accent); }
    .toggle-pw svg { width: 16px; height: 16px; fill: currentColor; }

    /* ── Alert ── */
    .alert {
      display: none; padding: 11px 14px; border-radius: 8px;
      font-size: 0.82rem; line-height: 1.5; margin-bottom: 18px;
    }
    .alert-error {
      background: rgba(248,113,113,0.08);
      border: 1px solid rgba(248,113,113,0.22);
      color: var(--danger);
    }

    /* ── Button ── */
    .btn {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-g) 100%);
      border: none; border-radius: 10px; color: #fff;
      font-family: 'Syne', sans-serif; font-weight: 600; font-size: 0.9rem;
      letter-spacing: 0.02em; cursor: pointer;
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 6px;
      box-shadow: 0 4px 20px rgba(59,130,246,0.25);
    }
    .btn:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); box-shadow: 0 6px 24px rgba(59,130,246,0.35); }
    .btn:active:not(:disabled) { transform: translateY(0); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .spinner {
      display: none; width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff;
      border-radius: 50%; animation: spin 0.65s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer ── */
    .footer {
      margin-top: 28px; text-align: center;
      font-size: 0.72rem; color: var(--muted); line-height: 1.6;
    }
    .footer span {
      display: inline-block; width: 4px; height: 4px;
      background: var(--muted); border-radius: 50; margin: 0 6px; vertical-align: middle;
    }

    @media (max-width: 480px) {
      .card { padding: 36px 26px; }
    }
  </style>
</head>
<body>

<div class="mesh"></div>
<div class="grid-lines"></div>

<div class="page">
  <div class="card">

    <div class="logo">
      <div class="logo-mark">
    <img src="Whilter_logo.png" alt="Whilter.AI logo"
         style="width:24px; height:24px;">
    </div>
      <span class="logo-name">Whilter.AI Analytics Portal</span>
    </div>

    <div class="card-title">Sign in</div>
    <div class="card-sub">Enter your credentials to access the dashboard</div>

    <div class="alert alert-error" id="errMsg" role="alert"></div>

    <div class="field">
      <label for="username">Username</label>
      <div class="input-wrap">
        <input type="text" id="username" placeholder="Enter username"
               autocomplete="username" autocapitalize="none" spellcheck="false"/>
        <svg class="input-icon" viewBox="0 0 24 24">
          <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
        </svg>
      </div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="input-wrap" style="position:relative;">
        <input type="password" id="password" placeholder="Enter password"
               autocomplete="current-password"/>
        <svg class="input-icon" viewBox="0 0 24 24">
          <path d="M18 8h-1V6A5 5 0 007 6v2H6a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V10a2 2 0 00-2-2zm-6 9a2 2 0 110-4 2 2 0 010 4zm3.1-9H8.9V6a3.1 3.1 0 016.2 0v2z"/>
        </svg>
        <button class="toggle-pw" type="button" onclick="togglePw()" title="Show/hide password" tabindex="-1">
          <svg id="eyeIcon" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5C21.27 7.61 17 4.5 12 4.5zm0 12.5a5 5 0 110-10 5 5 0 010 10zm0-8a3 3 0 100 6 3 3 0 000-6z"/></svg>
        </button>
      </div>
    </div>

    <button class="btn" id="loginBtn" onclick="handleLogin()">
      <div class="spinner" id="spinner"></div>
      <span id="btnLabel">Sign In</span>
    </button>

    <div class="footer">
      Restricted access &nbsp;<span></span>&nbsp; Authorised users only
    </div>

  </div>
</div>

<script>
  // ── Show / hide password ──────────────────────────────────────────
  function togglePw() {
    const input = document.getElementById('password');
    input.type = input.type === 'password' ? 'text' : 'password';
  }

  // ── UI helpers ────────────────────────────────────────────────────
  function showError(msg) {
    const el = document.getElementById('errMsg');
    el.textContent = msg;
    el.style.display = 'block';
    // shake animation
    el.animate([
      { transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' },
      { transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' },
      { transform: 'translateX(0)' }
    ], { duration: 300 });
  }

  function setLoading(on) {
    document.getElementById('loginBtn').disabled = on;
    document.getElementById('spinner').style.display = on ? 'block' : 'none';
    document.getElementById('btnLabel').textContent = on ? 'Signing in…' : 'Sign In';
  }

  // ── Check existing session on load ────────────────────────────────
  window.addEventListener('DOMContentLoaded', () => {
    const session = sessionStorage.getItem('auth_token');
    if (session) {
      // Verify token is still valid with server
      fetch('/.netlify/functions/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: session })
      })
      .then(r => r.json())
      .then(data => { if (data.ok) window.location.replace('/dashboard.html'); })
      .catch(() => { /* no session, stay on login */ });
    }
  });

  // ── Login ─────────────────────────────────────────────────────────
  async function handleLogin() {
    document.getElementById('errMsg').style.display = 'none';

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!username || !password) {
      showError('Please enter both username and password.');
      return;
    }

    setLoading(true);

    try {
      const res = await fetch('/.netlify/functions/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();

      if (res.ok && data.token) {
        // Store session token (NOT the password — just a server-issued token)
        sessionStorage.setItem('auth_token', data.token);
        window.location.replace('/dashboard.html');
      } else {
        showError(data.message || 'Invalid username or password.');
        setLoading(false);
      }

    } catch (err) {
      showError('Connection error. Please try again.');
      setLoading(false);
    }
  }

  // ── Enter key ─────────────────────────────────────────────────────
  ['username','password'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') handleLogin();
    });
  });
</script>
</body>
</html>
